[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fibermind"
version = "0.1.0"
description = "RAG-based optical network fault diagnosis system"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "websockets==15.0.1",
  "pydantic==2.11.4",
  "pydantic-settings==2.9.1",
  "httpx==0.28.1",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
infra = [
  "redis==5.2.1",
  "sqlalchemy==2.0.40",
  "pymysql==1.1.1",
  "pymilvus==2.5.6",
]
ml = [
  "torch>=2.2",
  "transformers>=4.48,<5",
  "sentence-transformers>=3.4",
  "FlagEmbedding>=1.3.4",
  "datasets>=3.2",
  "accelerate>=1.3",
]
eval = [
  "ragas==0.2.15",
  "langchain-openai==0.3.14",
  "pandas>=2.2",
  "datasets>=3.2",
]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "ruff==0.11.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
